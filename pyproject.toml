[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claire"
version = "1.0.0"
description = "Real-time AI voice assistant — local, free, and fully capable."
requires-python = ">=3.11"
dependencies = [
    "httpx",                                       # HTTP client for Groq API + RSS feeds
    "kokoro-onnx",                                 # Local TTS engine (Kokoro-82M)
    "sounddevice",                                 # Direct mic capture + speaker playback
    "numpy",                                       # Array ops for audio processing
    "duckduckgo_search",                           # Free web search — no API key needed
    "python-dotenv",                               # .env file loading
    "customtkinter",                               # Dynamic Island overlay UI
]

[project.scripts]
claire_voice = "voice_agent.agent_claire:dev"

[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]
