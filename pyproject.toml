[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claire"
version = "1.0.0"
description = "Real-time AI voice assistant — local, free, and fully capable."
requires-python = ">=3.11"
dependencies = [
    "fastmcp",                                     # MCP server framework
    "httpx",                                       # Async HTTP client
    "livekit-agents[openai,silero]>=1.5.1",        # Voice pipeline + Silero VAD + OpenAI-compat plugin (Groq)
    "vosk",                                        # Offline local STT engine
    "kokoro-onnx",                                 # Local TTS engine (Kokoro-82M)
    "soundfile",                                   # Audio file I/O for Kokoro output
    "numpy",                                       # Array ops for audio processing
    "duckduckgo_search",                           # Free web search — no API key needed
    "python-dotenv",                               # .env file loading
]

[project.scripts]
claire       = "mcp_server.server:main"
claire_voice = "voice_agent.agent_claire:dev"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "voice_agent"]
